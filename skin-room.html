<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Skin Room</title>
    <style>
        @font-face {
            font-family: 'MyFont';
            src: url('https://jsd.onmicrosoft.cn/gh/flusbk/font/letters%202.woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5vh;
            box-sizing: border-box;
            font-family: 'MyFont', 'Georgia', serif;
        }

        .header-box {
            width: 900px;
            min-height: 80px;
            background-color: #ffffff;
            border: 2px solid #ECECEC;
            border-radius: 30px;
            margin-top: 16px;
            position: relative;
            box-shadow: 0 8px 40px rgba(245, 245, 245, 1);
            padding: 25px 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .back-home {
            font-size: 25px;
            color: #666B72;
            text-decoration: none;
        }

        .back-home:hover {
            color: #000000;
        }

        .header-title {
            font-weight: bold;
            color: #000000;
            font-size: 35px;
            margin: 0;
        }

        .search-box {
            width: 900px;
            min-height: 80px;
            background-color: #ffffff;
            border: 2px solid #ECECEC;
            border-radius: 30px;
            margin-top: 16px;
            position: relative;
            box-shadow: 0 8px 40px rgba(245, 245, 245, 1);
            padding: 20px 30px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ECECEC;
            border-radius: 50px;
            font-size: 23px;
            font-family: inherit;
            outline: none;
            min-width: 150px;
        }

        .search-box input:focus {
            border-color: #666B72;
        }

        .search-box .capsule-btn {
            padding: 12px 28px;
            border: 2px solid #ECECEC;
            border-radius: 50px;
            background-color: #FBFBFB;
            font-size: 23px;
            color: #666B72;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-box .capsule-btn:hover {
            background-color: #ECECEC;
        }

        .file-box {
            width: 900px;
            min-height: 150px;
            background-color: #ffffff;
            border: 2px solid #ECECEC;
            border-radius: 30px;
            margin-top: 16px;
            position: relative;
            box-shadow: 0 8px 40px rgba(245, 245, 245, 1);
            padding: 30px 35px;
            box-sizing: border-box;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 12px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border: 2px solid #ECECEC;
            border-radius: 16px;
            background-color: #ffffff;
        }

        .file-item .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-item .file-name {
            font-size: 25px;
            color: #000000;
        }

        .file-item .file-meta {
            font-size: 21px;
            color: #9DA2A9;
        }

        .file-item .download-btn {
            padding: 8px 20px;
            border: 2px solid #ECECEC;
            border-radius: 50px;
            background-color: #FBFBFB;
            font-size: 21px;
            color: #666B72;
            text-decoration: none;
            cursor: pointer;
            flex-shrink: 0;
            display: inline-block;
        }

        .file-item .download-btn:hover {
            background-color: #ECECEC;
        }

        .count-badge {
            font-size: 23px;
            color: #9DA2A9;
            margin-top: 10px;
            text-align: right;
        }

        .no-result {
            font-size: 25px;
            color: #9DA2A9;
            text-align: center;
            padding: 40px 0;
            display: none;
        }

        .empty-tip {
            font-size: 25px;
            color: #9DA2A9;
            text-align: center;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <a href="index.html" class="back-home">← back home</a>
        <div class="header-title">Skin Room</div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索：皮肤名 / 彩融底" oninput="filterFiles()">
        <span class="capsule-btn" onclick="clearSearch()">清空</span>
    </div>

    <div class="file-box">
        <div class="file-list" id="fileList">
            <div class="file-item" data-name="天使心跳是来自天国的白色音符" data-meta="@作者名">
                <div class="file-info">
                    <span class="file-name">天使心跳是来自天国的白色音符</span>
                    <span class="file-meta">@ikk</span>
                </div>
                <a href="https://raw.githubusercontent.com/flusbk/ikkcloudroom/main/天使心跳是来自天国的白的音符.bdi" target="_blank" class="download-btn">下载</a>
            </div>
        </div>
        <div class="no-result" id="noResult">🔍 未找到文件</div>
        <div class="count-badge" id="countBadge">共 1 个文件</div>
    </div>

    <script>
        function filterFiles() {
            const input = document.getElementById('searchInput');
            const keyword = input.value.trim().toLowerCase();
            const items = document.querySelectorAll('.file-item');
            let visibleCount = 0;

            items.forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                const meta = item.getAttribute('data-meta').toLowerCase();
                const match = name.includes(keyword) || meta.includes(keyword);

                if (keyword === '' || match) {
                    item.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });

            document.getElementById('countBadge').textContent = '共 ' + visibleCount + ' 个文件';
            const noResult = document.getElementById('noResult');
            if (keyword !== '' && visibleCount === 0) {
                noResult.style.display = 'block';
            } else {
                noResult.style.display = 'none';
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterFiles();
        }
    </script>

</body>
</html>
